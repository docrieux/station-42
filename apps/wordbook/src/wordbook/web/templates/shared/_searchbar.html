{% from "_macros.html" import flag, langlabel %}
<div class="searchrow">
  <form class="search" method="get" action="{{ prefix }}/" role="search">
    <input type="hidden" name="lang" value="{{ lang }}">
    <input type="hidden" name="sort" value="{{ sort }}">
    <input type="search" name="q" value="{{ query }}" placeholder="Search a word…" autocomplete="off" spellcheck="false">
    <button type="submit" class="magnifier" aria-label="Search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
    </button>
  </form>
  <details class="langmenu">
    <summary>{{ flag(lang) }}<span class="lbl">{{ langlabel(lang) }}</span><span class="chev" aria-hidden="true"></span></summary>
    <div class="menu">
      <a href="{{ prefix }}/?lang=es{% if query %}&amp;q={{ query | urlencode }}{% endif %}"{% if lang == 'es' %} aria-current="true"{% endif %}>{{ flag('es') }} Español</a>
      <a href="{{ prefix }}/?lang=en{% if query %}&amp;q={{ query | urlencode }}{% endif %}"{% if lang == 'en' %} aria-current="true"{% endif %}>{{ flag('en') }} English</a>
    </div>
  </details>
</div>
