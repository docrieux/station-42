<!doctype html>
<html lang="{{ 'es' if lang == 'es' else 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}wordbook{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script defer src="/static/app.js"></script>
</head>
<body class="{% block variant %}{% endblock %}" data-lang="{{ lang }}" data-sort="{{ sort }}">
  <main class="wrap">
    {% block body %}{% endblock %}
  </main>
</body>
</html>
