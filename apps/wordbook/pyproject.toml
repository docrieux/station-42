# Copied by `just new-app <name>`, which substitutes the placeholder name.
# This folder itself is excluded from the uv workspace.
[project]
name = "wordbook"
version = "0.1.0"
description = "The wordbook service for Station 42"
requires-python = ">=3.12"
dependencies = [
    "station-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
station-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wordbook"]
