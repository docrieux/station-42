name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen --all-packages

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run --all-packages pytest

      - name: Validate compose config
        run: docker compose --env-file .env.example config -q

  images:
    name: build arm64 images
    runs-on: ubuntu-latest
    # Confidence check that every app image builds for the Pi's architecture.
    # Does not push — see docs/operations.md for the GHCR upgrade.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build caddy image (arm64)
        run: docker buildx build --platform linux/arm64 -t station42/caddy:ci ./infra/caddy

      - name: Build app images (arm64)
        run: |
          for dir in apps/*/; do
            app=$(basename "$dir")
            [ "$app" = "_template" ] && continue
            [ -f "$dir/Dockerfile" ] || continue
            echo "::group::build $app"
            docker buildx build --platform linux/arm64 -f "$dir/Dockerfile" -t "station42/$app:ci" .
            echo "::endgroup::"
          done
