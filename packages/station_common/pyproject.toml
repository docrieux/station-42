[project]
name = "station-common"
version = "0.1.0"
description = "Shared helpers for Station 42 apps: settings, logging, health check."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/station_common"]
