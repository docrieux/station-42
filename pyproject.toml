[project]
name = "station-42"
version = "0.0.0"
description = "Monorepo for self-hosted tools running on a Raspberry Pi 4B"
requires-python = ">=3.12"
# This root package is a workspace container only; it ships no code of its own.
dependencies = []

[tool.uv.workspace]
members = ["apps/*", "packages/*"]
exclude = ["apps/_template"]

[tool.uv.sources]
station-common = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "httpx>=0.27",          # FastAPI TestClient dependency
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/_template"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["station_common"]

[tool.pytest.ini_options]
testpaths = ["apps", "packages"]
# importlib mode: each app ships tests/test_api.py + tests/test_ui.py with no
# __init__.py, so the default "prepend" mode collides on the duplicate basenames
# once a second app exists.
addopts = "-q --import-mode=importlib"
norecursedirs = ["_template", ".*", "build", "dist", "*.egg-info", "data"]
